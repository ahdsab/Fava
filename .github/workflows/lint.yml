name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Python tools
        run: |
          pip install ruff black mypy
          pip install types-setuptools types-requests types-simplejson
      
      - name: Install Node.js tools
        run: |
          cd frontend
          npm install
      
      - name: Run Python linting
        run: |
          ruff check .
          ruff format --check .
      
      - name: Run MyPy
        run: mypy . --ignore-missing-imports --no-strict-optional
      
      - name: Run JavaScript/TypeScript linting
        run: |
          cd frontend
          npx biome check --error-on-warnings
          npx eslint . --config eslint.config.mjs --max-warnings 0
      
      - name: Run CSS linting
        run: |
          cd frontend
          npx stylelint "**/*.{css,svelte}" --fix
      
      - name: Run Prettier
        run: |
          cd frontend
          npx prettier --check --list-different .
      
      - name: Run Markdown formatting
        run: |
          pip install mdformat mdformat-gfm
          mdformat --check --wrap 80 .
